name: Check Quarto Site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Install check dependencies
        run: npm ci --ignore-scripts
      - name: Validate post metadata
        run: npm run check:posts
      - name: Test validation and helper contracts
        run: npm test
      - name: Render site
        run: quarto render --clean
      - name: Validate rendered links and assets
        run: npm run check:site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check browser behavior
        run: npm run test:browser
