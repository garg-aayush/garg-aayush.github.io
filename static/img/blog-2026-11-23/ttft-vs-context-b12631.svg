<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392">
  <title>Time to first token vs prompt size</title>
  <desc>On build b12631, cold prompt time to first token grows with prompt size until each setup hits its VRAM ceiling: 146 s at 259K for 8-bit KV, 125 s at 226K for 8-bit KV + DSpark, 58 s at 136K for 16-bit KV + DSpark. Cached follow-up turns stay under 1 second.</desc>
