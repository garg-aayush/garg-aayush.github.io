<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 386" width="700" height="386">
  <title>Code generation speed as context grows</title>
  <desc>On build b12631, empty context speeds are 98 tok/s for 8-bit KV with DSpark, 103 tok/s for 16-bit KV with DSpark and 76 tok/s for plain 8-bit KV. At 120K tokens 16-bit KV with DSpark ends at 61 tok/s; at 160K tokens 8-bit KV with DSpark is 43 tok/s and plain 8-bit KV is 55 tok/s.</desc>
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .title { font-size: 16px; font-weight: 600; fill: #F5F5F7; }
      .subtitle { font-size: 12.5px; font-weight: 400; fill: #86868B; }
      .label { font-size: 13px; font-weight: 500; fill: #DADADF; }
      .val { font-size: 13px; font-weight: 600; fill: #F5F5F7; }
      .val-sm { font-size: 12px; font-weight: 600; fill: #F5F5F7; }
      .tick { font-size: 11.5px; font-weight: 400; fill: #86868B; }
      .axis-title { font-size: 12px; font-weight: 400; fill: #A6A6AB; }
      .legend { font-size: 12.5px; font-weight: 500; fill: #DADADF; }
      .note { font-size: 11.5px; font-weight: 400; fill: #A6A6AB; }
      .note-dim { font-size: 11px; font-weight: 400; fill: #86868B; }
    </style>
  </defs>
  <rect width="700" height="386" fill="#161618"/>
  <text class="title" x="28" y="34">Code generation speed as context grows</text>
  <text class="subtitle" x="28" y="54">Build b12631, low thinking effort, four coding problems per depth (tokens per second)</text>
  <line x1="28" y1="76" x2="46" y2="76" stroke="#3B9EFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="37" cy="76" r="3.5" fill="#3B9EFF" stroke="#161618" stroke-width="1.5"/>
  <text class="legend" x="53" y="80">16-bit KV + DSpark</text>
  <line x1="199" y1="76" x2="217" y2="76" stroke="#F0884D" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="208" cy="76" r="3.5" fill="#F0884D" stroke="#161618" stroke-width="1.5"/>
  <text class="legend" x="224" y="80">8-bit KV</text>
  <line x1="301" y1="76" x2="319" y2="76" stroke="#52C48A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="310" cy="76" r="3.5" fill="#52C48A" stroke="#161618" stroke-width="1.5"/>
  <text class="legend" x="326" y="80">8-bit KV + DSpark</text>
  <line x1="68" y1="330.0" x2="636" y2="330.0" stroke="#34343B" stroke-width="1"/>
  <text class="tick" x="58" y="334.0" text-anchor="end">0</text>
  <line x1="68" y1="297.7" x2="636" y2="297.7" stroke="#26262B" stroke-width="1"/>
  <text class="tick" x="58" y="301.7" text-anchor="end">20</text>
  <line x1="68" y1="265.4" x2="636" y2="265.4" stroke="#26262B" stroke-width="1"/>
  <text class="tick" x="58" y="269.4" text-anchor="end">40</text>
  <line x1="68" y1="233.1" x2="636" y2="233.1" stroke="#26262B" stroke-width="1"/>
  <text class="tick" x="58" y="237.1" text-anchor="end">60</text>
  <line x1="68" y1="200.9" x2="636" y2="200.9" stroke="#26262B" stroke-width="1"/>
  <text class="tick" x="58" y="204.9" text-anchor="end">80</text>
  <line x1="68" y1="168.6" x2="636" y2="168.6" stroke="#26262B" stroke-width="1"/>
  <text class="tick" x="58" y="172.6" text-anchor="end">100</text>
  <line x1="68" y1="136.3" x2="636" y2="136.3" stroke="#26262B" stroke-width="1"/>
  <text class="tick" x="58" y="140.3" text-anchor="end">120</text>
  <line x1="68" y1="104.0" x2="636" y2="104.0" stroke="#26262B" stroke-width="1"/>
  <text class="tick" x="58" y="108.0" text-anchor="end">140 t/s</text>
  <line x1="68.0" y1="330" x2="68.0" y2="334" stroke="#34343B" stroke-width="1"/>
  <text class="tick" x="68.0" y="349" text-anchor="middle">0</text>
  <line x1="181.6" y1="330" x2="181.6" y2="334" stroke="#34343B" stroke-width="1"/>
  <text class="tick" x="181.6" y="349" text-anchor="middle">32K</text>
  <line x1="295.2" y1="330" x2="295.2" y2="334" stroke="#34343B" stroke-width="1"/>
  <text class="tick" x="295.2" y="349" text-anchor="middle">64K</text>
  <line x1="408.8" y1="330" x2="408.8" y2="334" stroke="#34343B" stroke-width="1"/>
  <text class="tick" x="408.8" y="349" text-anchor="middle">96K</text>
  <line x1="494.0" y1="330" x2="494.0" y2="334" stroke="#34343B" stroke-width="1"/>
  <text class="tick" x="494.0" y="349" text-anchor="middle">120K</text>
  <line x1="636.0" y1="330" x2="636.0" y2="334" stroke="#34343B" stroke-width="1"/>
  <text class="tick" x="636.0" y="349" text-anchor="middle">160K</text>
  <text class="axis-title" x="352.0" y="372" text-anchor="middle">Code already in context (tokens)</text>
  <line x1="295.2" y1="110" x2="295.2" y2="330" stroke="#26262B" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="note-dim" x="301.2" y="122">Past 64K, plain 8-bit KV beats 8-bit KV + DSpark</text>
  <polyline points="68.0,164.0 181.6,192.9 295.2,215.7 408.8,223.4 494.0,232.2" fill="none" stroke="#3B9EFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="68.0" cy="164.0" r="3.8" fill="#3B9EFF" stroke="#161618" stroke-width="1.5"/>
  <circle cx="181.6" cy="192.9" r="3.8" fill="#3B9EFF" stroke="#161618" stroke-width="1.5"/>
  <circle cx="295.2" cy="215.7" r="3.8" fill="#3B9EFF" stroke="#161618" stroke-width="1.5"/>
  <circle cx="408.8" cy="223.4" r="3.8" fill="#3B9EFF" stroke="#161618" stroke-width="1.5"/>
  <circle cx="494.0" cy="232.2" r="3.8" fill="#3B9EFF" stroke="#161618" stroke-width="1.5"/>
  <polyline points="68.0,206.6 181.6,216.6 295.2,223.5 408.8,230.6 494.0,234.5 636.0,241.2" fill="none" stroke="#F0884D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="68.0" cy="206.6" r="3.8" fill="#F0884D" stroke="#161618" stroke-width="1.5"/>
  <circle cx="181.6" cy="216.6" r="3.8" fill="#F0884D" stroke="#161618" stroke-width="1.5"/>
  <circle cx="295.2" cy="223.5" r="3.8" fill="#F0884D" stroke="#161618" stroke-width="1.5"/>
  <circle cx="408.8" cy="230.6" r="3.8" fill="#F0884D" stroke="#161618" stroke-width="1.5"/>
  <circle cx="494.0" cy="234.5" r="3.8" fill="#F0884D" stroke="#161618" stroke-width="1.5"/>
  <circle cx="636.0" cy="241.2" r="3.8" fill="#F0884D" stroke="#161618" stroke-width="1.5"/>
  <polyline points="68.0,171.2 181.6,202.5 295.2,230.1 408.8,237.1 494.0,251.0 636.0,260.8" fill="none" stroke="#52C48A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="68.0" cy="171.2" r="3.8" fill="#52C48A" stroke="#161618" stroke-width="1.5"/>
  <circle cx="181.6" cy="202.5" r="3.8" fill="#52C48A" stroke="#161618" stroke-width="1.5"/>
  <circle cx="295.2" cy="230.1" r="3.8" fill="#52C48A" stroke="#161618" stroke-width="1.5"/>
  <circle cx="408.8" cy="237.1" r="3.8" fill="#52C48A" stroke="#161618" stroke-width="1.5"/>
  <circle cx="494.0" cy="251.0" r="3.8" fill="#52C48A" stroke="#161618" stroke-width="1.5"/>
  <circle cx="636.0" cy="260.8" r="3.8" fill="#52C48A" stroke="#161618" stroke-width="1.5"/>
  <text class="val-sm" x="76.0" y="155.0" text-anchor="start" style="fill:#3B9EFF">103</text>
  <text class="val-sm" x="494.0" y="221.2" text-anchor="middle" style="fill:#3B9EFF">61</text>
  <text class="val-sm" x="74.0" y="222.6" text-anchor="start" style="fill:#F0884D">76</text>
  <text class="val-sm" x="646.0" y="245.2" text-anchor="start" style="fill:#F0884D">55</text>
  <text class="val-sm" x="74.0" y="189.2" text-anchor="start" style="fill:#52C48A">98</text>
  <text class="val-sm" x="646.0" y="264.8" text-anchor="start" style="fill:#52C48A">43</text>

</svg>
