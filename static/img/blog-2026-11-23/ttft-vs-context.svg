<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392">
  <title>Time to first token vs prompt size</title>
  <desc>Cold prompt time to first token grows with prompt size and is almost identical across setups until each hits its VRAM ceiling: 58 s at 136K for 16-bit KV with DSpark, 125 s at 226K for 8-bit KV with DSpark and 146 s at 259K for 8-bit KV. Cached follow-up turns stay under 1 second.</desc>
