    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .title { font-size: 16px; font-weight: 600; fill: #F5F5F7; }
      .subtitle { font-size: 12.5px; font-weight: 400; fill: #86868B; }
      .label { font-size: 13px; font-weight: 500; fill: #DADADF; }
      .val { font-size: 13px; font-weight: 600; fill: #F5F5F7; }
      .val-sm { font-size: 12px; font-weight: 600; fill: #F5F5F7; }
      .tick { font-size: 11.5px; font-weight: 400; fill: #86868B; }
      .axis-title { font-size: 12px; font-weight: 400; fill: #A6A6AB; }
      .legend { font-size: 12.5px; font-weight: 500; fill: #DADADF; }
      .note { font-size: 11.5px; font-weight: 400; fill: #A6A6AB; }
      .note-dim { font-size: 11px; font-weight: 400; fill: #86868B; }
    </style>
  </defs>
