project:
  type: website
  output-dir: _site
  post-render:
    - node scripts/preserve-feed-guids.mjs
  render:
    - index.qmd
    - about.qmd
    - publications.qmd
    - blog/index.qmd
    - pages/*.qmd
    - posts/*.qmd
    - posts/*/index.qmd
    - projects.qmd
    - tools/index.qmd
    - india-weather.qmd

website:
  title: "Aayush Garg"
  description: "Personal website"
  site-url: "https://aayushgarg.dev"
  google-analytics: "G-16JWTLXJNG"
  favicon: "static/img/aayush_cropped.jpg"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    background: dark
    pinned: true
    collapse: false
    right:
      - text: Writing
        href: blog/
      - text: Work
        href: projects.qmd
      - text: Tools
        href: tools/
      - text: About
        href: about.qmd
  page-footer:
    left: "© 2026 Aayush Garg"
    right:
      - text: GitHub
        href: "https://github.com/garg-aayush"
      - text: LinkedIn
        href: "https://www.linkedin.com/in/aayush-garg-8b26a734"
      - text: X
        href: "https://twitter.com/Aayush_ander"
      - text: RSS
        href: "https://aayushgarg.dev/blog/index.xml"

format:
  html:
    from: markdown+raw_html
    theme: [cosmo, theme-dark.scss]
    css:
      - static/fonts/fonts.css
      - static/design-tokens.css
      - styles.css
      - static/css/home.css
      - static/css/article.css
      - static/css/pages.css
    include-in-header:
      - text: |
          <link rel="preload" href="/static/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    include-after-body:
      - text: |
          <script src="/static/js/site.js"></script>
    toc: true
    smooth-scroll: true
    link-external-newwindow: true

resources:
  - static
  - tools/*.html
  - tools/common.css
  - tools/file-utils.js
  - tools/analytics.js
  - CNAME
