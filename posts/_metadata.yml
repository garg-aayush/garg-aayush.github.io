# Applies to every post. Interface words (toc-title, back-link-text, byline) are edited here. The grid values mirror the layout in static/css/article.css: 190px rail, 72px gap, 700px text column.
page-layout: article
toc-location: left
toc-title: Contents
back-link-text: All writing
back-link-href: /blog/
byline: Aayush Garg
format:
  html:
    toc: true
    toc-depth: 3
    code-copy: true
    body-classes: article-page
    date-format: YYYY-MM-DD
    template-partials:
      - ../_partials/title-block.html
    filters:
      - ../_filters/article.lua
    grid:
      sidebar-width: 190px
      body-width: 844px
      margin-width: 0px
      gutter-width: 72px
execute:
  freeze: true
